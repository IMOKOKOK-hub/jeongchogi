<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>정처기 실기 복습 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ac:#3B5BDB;--ac2:#4C6EF5;--ac-light:#EEF2FF;
  --bg:#F8F9FC;--card:#fff;--text:#1A1D2E;--sub:#6B7280;
  --border:#E4E7F0;--green:#059669;--red:#DC2626;--orange:#D97706;
  --nav-h:68px;
}
html{height:100%}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100%;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px)}

/* ── HEADER ── */
.hd{background:#fff;border-bottom:1.5px solid var(--border);padding:12px 16px 0;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.hd-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hd-title{font-size:17px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:6px}
.hd-badge{background:var(--ac);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.3px}
.hd-stat{font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.mode-tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px;margin-bottom:10px}
.mode-tab{flex:1;padding:8px 4px;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--sub);background:transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:4px}
.mode-tab.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1.5px solid var(--border);display:flex;z-index:300;padding-bottom:env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;cursor:pointer;color:var(--sub);font-family:inherit;font-size:9px;font-weight:700;padding:8px 2px 4px;transition:all .2s;position:relative}
.nav-btn .ico{font-size:21px;line-height:1;transition:transform .2s}
.nav-btn.on{color:var(--ac)}
.nav-btn.on .ico{transform:scale(1.1)}
.nav-dot{position:absolute;top:8px;right:calc(50% - 14px);width:6px;height:6px;border-radius:50%;background:var(--red);display:none}
.nav-dot.show{display:block}

/* ── MAIN ── */
.main{padding:12px}
.view{display:none}.view.on{display:block}

/* ── REVIEW CARDS ── */
.rcard{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1.5px solid var(--border);overflow:hidden;transition:border-color .2s}
.rcard.open{border-color:var(--ac)}
.rcard-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;gap:8px;user-select:none;-webkit-user-select:none}
.rcard-hd-l{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.rcard-num{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;background:var(--ac-light);color:var(--ac)}
.rcard-name{font-size:13.5px;font-weight:700;line-height:1.3}
.prob-badge{font-size:13px;flex-shrink:0}
.arr{font-size:12px;color:#ccc;transition:transform .25s;flex-shrink:0}
.rcard.open .arr{transform:rotate(180deg)}
.rcard-body{display:none;border-top:1.5px solid var(--border);padding:13px 14px}
.rcard.open .rcard-body{display:block}

/* tables */
.rt{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0;border-radius:8px;overflow:hidden}
.rt th{background:var(--ac-light);padding:7px 10px;text-align:left;font-weight:800;color:var(--ac);border-bottom:1.5px solid var(--border);font-size:11.5px}
.rt td{padding:7px 10px;border-bottom:1px solid var(--border);color:#333;vertical-align:top;line-height:1.55;font-size:12.5px}
.rt tr:last-child td{border-bottom:none}
.rt td b,.rt td strong{color:#111;font-weight:800}
.rt td code{background:#F1F3F9;padding:1px 5px;border-radius:4px;font-size:11px;font-family:monospace;color:#2563EB}
.tip{background:var(--ac-light);border-left:3px solid var(--ac);border-radius:0 8px 8px 0;padding:10px 12px;margin-top:8px;font-size:12.5px;line-height:1.75;color:#333}
.tip b{color:var(--ac)}
.mnemo{background:var(--text);color:#fff;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;margin-bottom:8px;display:inline-block;letter-spacing:.2px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:8px 0}
.flow .s{background:var(--ac-light);border:1.5px solid #c5d0f8;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--ac)}
.flow .a{color:#bbb;font-size:11px}

/* ── QUIZ ── */
.quiz-view{display:none;flex-direction:column;gap:10px}
.quiz-view.on{display:flex}

/* progress */
.prog-card{background:#fff;border-radius:12px;padding:11px 14px;border:1.5px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.prog-label{font-size:11.5px;font-weight:700;color:var(--sub)}
.prog-score{font-size:12px;font-weight:800;display:flex;gap:12px}
.score-c{color:var(--green)}.score-w{color:var(--red)}
.pbar{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* question card */
.qcard{background:#fff;border-radius:16px;border:1.5px solid var(--border);box-shadow:0 3px 12px rgba(0,0,0,.07);overflow:hidden;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.qcard-top{background:var(--ac-light);padding:9px 16px;display:flex;justify-content:space-between;align-items:center}
.qcat{font-size:11px;font-weight:800;color:var(--ac)}
.qnum{font-size:11px;font-weight:700;color:var(--sub)}
.qbody{padding:18px 16px 14px}
.qtype-wrap{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.qtype-badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:5px;display:inline-block}
.qtype-badge.fill{background:#FEF3C7;color:#92400E}
.qtype-badge.term{background:#EDE9FE;color:#5B21B6}
.qtype-badge.order{background:#DCFCE7;color:#166534}
.qdiff{font-size:10.5px;font-weight:700;color:var(--sub)}
.qtxt{font-size:15px;font-weight:700;line-height:1.7;color:#111}
.blank{display:inline-block;min-width:55px;border-bottom:2.5px solid var(--ac);color:var(--ac);font-weight:900;padding:0 4px;text-align:center;margin:0 1px}

/* reveal */
.reveal-btn{width:100%;padding:14px 16px;border:none;background:#F8F9FC;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--sub);cursor:pointer;border-top:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.reveal-btn:active{background:#EEF2FF}
.qans{display:none;border-top:2.5px solid var(--ac);padding:16px;background:#fff}
.qans.show{display:block}
.ans-tag{font-size:10px;font-weight:900;color:var(--ac);letter-spacing:.1em;margin-bottom:8px}
.ans-main{font-size:16px;font-weight:900;color:var(--text);margin-bottom:8px;line-height:1.6}
.ans-desc{font-size:13px;color:#555;line-height:1.7;font-weight:500}
.ans-desc b{color:#111;font-weight:800}

/* action buttons */
.qactions{display:none;gap:10px}
.qactions.show{display:grid;grid-template-columns:1fr 1fr}
.btn-wrong{padding:15px;border-radius:12px;border:none;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;background:var(--red);color:#fff;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-right{padding:15px;border-radius:12px;border:none;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;background:var(--green);color:#fff;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-wrong:active,.btn-right:active{opacity:.82}

/* result */
.qresult{background:#fff;border-radius:16px;border:1.5px solid var(--border);padding:28px 20px;text-align:center;display:none;box-shadow:0 3px 12px rgba(0,0,0,.07)}
.qresult.show{display:block;animation:fadeUp .35s ease both}
.res-emoji{font-size:56px;margin-bottom:8px}
.res-title{font-size:21px;font-weight:900;margin-bottom:4px}
.res-sub{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6}
.res-pct{font-size:52px;font-weight:900;color:var(--ac);line-height:1;margin-bottom:12px}
.res-stats{display:flex;justify-content:center;gap:28px;margin-bottom:22px;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.res-stat .n{font-size:24px;font-weight:900;line-height:1}
.res-stat .l{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:3px}
.btn-retry{width:100%;padding:14px;border-radius:12px;border:none;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;background:var(--ac);color:#fff;margin-bottom:8px;transition:opacity .2s}
.btn-retry:active{opacity:.85}
.btn-review-wrong{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--red);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--red);margin-bottom:8px;display:none}
.btn-review-wrong.show{display:block}
.btn-back{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--border);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--text)}

/* wrong list */
.wrong-review{display:none;flex-direction:column;gap:8px}
.wrong-review.on{display:flex}
.wrong-card{background:#fff;border-radius:12px;border:1.5px solid #FFE4E4;padding:13px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.wrong-q{font-size:13px;font-weight:700;color:#111;margin-bottom:8px;line-height:1.6}
.wrong-a{font-size:13px;color:var(--green);font-weight:800;background:#F0FDF4;padding:8px 10px;border-radius:8px;line-height:1.5}
.wrong-a-label{font-size:10px;color:var(--green);font-weight:800;letter-spacing:.08em;margin-bottom:3px}
.back-quiz-btn{width:100%;padding:13px;border-radius:12px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--ac);color:#fff;margin-bottom:10px}

/* section header */
.sec-hd{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.08em;padding:4px 2px 8px;margin-top:4px}

/* quiz filter */
.filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-btn{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:var(--sub);transition:all .15s}
.filter-btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-row">
    <div class="hd-title">
      <span id="hd-cat-name">DB</span>
      <span class="hd-badge" id="hd-badge">💯</span>
    </div>
    <span class="hd-stat" id="hd-stat"></span>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab on" onclick="setMode('review')">📖 복습</button>
    <button class="mode-tab" onclick="setMode('quiz')">✏️ 퀴즈</button>
    <button class="mode-tab" onclick="setMode('wronglist')">❌ 오답</button>
  </div>
</div>

<div class="main">
  <!-- REVIEW -->
  <div class="view on" id="view-review"></div>

  <!-- QUIZ -->
  <div class="quiz-view" id="view-quiz">
    <div class="prog-card">
      <div class="prog-top">
        <span class="prog-label" id="prog-label">0 / 0</span>
        <div class="prog-score"><span class="score-c" id="sc-c">✓ 0</span><span class="score-w" id="sc-w">✗ 0</span></div>
      </div>
      <div class="pbar"><div class="pbar-fill" id="pbar" style="width:0%"></div></div>
    </div>

    <div class="qcard" id="qcard">
      <div class="qcard-top">
        <span class="qcat" id="q-section">—</span>
        <span class="qnum" id="q-num">1 / 30</span>
      </div>
      <div class="qbody">
        <div class="qtype-wrap">
          <span class="qtype-badge" id="q-type-badge"></span>
          <span class="qdiff" id="q-diff"></span>
        </div>
        <div class="qtxt" id="q-txt"></div>
      </div>
      <div class="qans" id="q-ans">
        <div class="ans-tag">✅ 정답</div>
        <div class="ans-main" id="q-ans-main"></div>
        <div class="ans-desc" id="q-ans-desc"></div>
      </div>
      <button class="reveal-btn" id="reveal-btn" onclick="reveal()">👆 탭해서 정답 확인</button>
    </div>

    <div class="qactions" id="qactions">
      <button class="btn-wrong" onclick="mark(false)">✗ 틀렸어</button>
      <button class="btn-right" onclick="mark(true)">✓ 맞았어</button>
    </div>

    <div class="qresult" id="qresult">
      <div class="res-emoji" id="r-emoji"></div>
      <div class="res-title" id="r-title"></div>
      <div class="res-sub" id="r-sub"></div>
      <div class="res-pct" id="r-pct"></div>
      <div class="res-stats">
        <div class="res-stat"><div class="n" style="color:var(--green)" id="r-c">0</div><div class="l">맞음</div></div>
        <div class="res-stat"><div class="n" style="color:var(--red)" id="r-w">0</div><div class="l">틀림</div></div>
        <div class="res-stat"><div class="n" id="r-t">0</div><div class="l">전체</div></div>
      </div>
      <button class="btn-retry" onclick="startQuiz()">🔁 다시 풀기</button>
      <button class="btn-review-wrong" id="btn-rw" onclick="goWrongList()">❌ 틀린 문제 보기</button>
      <button class="btn-back" onclick="setMode('review')">📖 복습 보기</button>
    </div>
  </div>

  <!-- WRONG LIST -->
  <div class="view" id="view-wronglist">
    <button class="back-quiz-btn" onclick="setMode('quiz')">↩ 퀴즈로 돌아가기</button>
    <div class="sec-hd" id="wl-hd">틀린 문제 목록</div>
    <div id="wl-body"></div>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn on" data-cat="db" onclick="setCat('db')"><span class="ico">🗄️</span>DB</button>
  <button class="nav-btn" data-cat="net" onclick="setCat('net')"><span class="ico">🌐</span>네트워크</button>
  <button class="nav-btn" data-cat="sw" onclick="setCat('sw')"><span class="ico">🧪</span>SW개발</button>
  <button class="nav-btn" data-cat="des" onclick="setCat('des')"><span class="ico">🏗️</span>SW설계</button>
  <button class="nav-btn" data-cat="sec" onclick="setCat('sec')"><span class="ico">🔐</span>보안</button>
</nav>

<script>
// ─────────────────────────────────────────
// DATA
// ─────────────────────────────────────────
const CATS = {
  db:  {name:'DB',       badge:'💯', color:'#3B5BDB'},
  net: {name:'네트워크/OS', badge:'⭐', color:'#7C3AED'},
  sw:  {name:'SW 개발',   badge:'🔥', color:'#059669'},
  des: {name:'SW 설계',   badge:'💯', color:'#D97706'},
  sec: {name:'보안/신기술', badge:'🔥', color:'#DC2626'},
};

// ── REVIEW DATA ──────────────────────────
const RV = {
db:[
{num:'1',name:'SQL 명령어 핵심',p:'💯',b:`
<div class="mnemo">INSERT · UPDATE · DELETE · DROP · ALTER · GRANT · REVOKE</div>
<table class="rt"><tr><th>상황</th><th>쿼리 핵심</th></tr>
<tr><td>데이터 추가</td><td><b>INSERT INTO</b> 테이블(컬럼) VALUES(값);</td></tr>
<tr><td>데이터 복제</td><td><b>INSERT INTO</b> 테이블1(컬럼) SELECT 컬럼 FROM 테이블2;</td></tr>
<tr><td>데이터 삭제</td><td><b>DELETE FROM</b> 테이블 WHERE 조건;</td></tr>
<tr><td>데이터 수정</td><td><b>UPDATE</b> 테이블 <b>SET</b> 컬럼=값 WHERE 조건;</td></tr>
<tr><td>테이블 제거</td><td><b>DROP TABLE</b> 테이블 RESTRICT/CASCADE;</td></tr>
<tr><td>권한 부여</td><td><b>GRANT</b> 권한 ON 테이블 TO 사용자;</td></tr>
<tr><td>권한 회수</td><td><b>REVOKE</b> 권한 ON 테이블 FROM 사용자;</td></tr>
<tr><td>컬럼 추가</td><td><b>ALTER TABLE</b> 테이블 ADD 컬럼명 타입;</td></tr>
<tr><td>컬럼 제거</td><td><b>ALTER TABLE</b> 테이블 DROP COLUMN 컬럼명;</td></tr>
<tr><td>인덱스 생성</td><td><b>CREATE INDEX</b> 이름 ON 테이블(컬럼);</td></tr>
<tr><td>뷰 생성</td><td><b>CREATE VIEW</b> 뷰명 AS SELECT ...;</td></tr>
</table>
<div class="tip"><b>LIKE 패턴:</b> '%문자%' 포함 / '문자%' 시작 / '_문자' 앞 한 글자<br><b>BETWEEN:</b> WHERE 컬럼 BETWEEN 1 AND 3 (1~3 포함)<br><b>IN:</b> WHERE 컬럼 IN (1,2,3)<br><b>NULL 조회:</b> WHERE 컬럼 IS NULL<br><b>AND가 OR보다 우선</b> 처리!</div>`},
{num:'2',name:'SQL 집계·조인·집합',p:'💯',b:`
<table class="rt"><tr><th>집계함수</th><th>설명</th></tr>
<tr><td><b>COUNT(*)</b></td><td>모든 행 개수</td></tr>
<tr><td><b>COUNT(컬럼)</b></td><td>NULL 제외한 행 개수</td></tr>
<tr><td><b>COUNT(DISTINCT 컬럼)</b></td><td>중복 제거 후 개수</td></tr>
<tr><td><b>SUM / AVG / MAX / MIN</b></td><td>합계·평균·최대·최소</td></tr>
</table>
<table class="rt" style="margin-top:8px"><tr><th>조인 종류</th><th>키워드</th></tr>
<tr><td><b>세타 조인</b></td><td>INNER JOIN ... ON 컬럼1 > 컬럼2 (비교 연산자)</td></tr>
<tr><td><b>동등 조인</b></td><td>INNER JOIN ... ON 컬럼1 = 컬럼2</td></tr>
<tr><td><b>자연 조인</b></td><td>NATURAL JOIN (중복 속성 자동 제거)</td></tr>
<tr><td><b>외부 조인</b></td><td>LEFT/RIGHT/FULL OUTER JOIN (불일치 → NULL)</td></tr>
<tr><td><b>교차 조인</b></td><td>CROSS JOIN (모든 조합)</td></tr>
</table>
<table class="rt" style="margin-top:8px"><tr><th>집합연산자</th><th>의미</th></tr>
<tr><td><b>UNION</b></td><td>중복 제거 합집합</td></tr>
<tr><td><b>UNION ALL</b></td><td>중복 허용 합집합</td></tr>
<tr><td><b>INTERSECT</b></td><td>교집합</td></tr>
<tr><td><b>EXCEPT / MINUS</b></td><td>차집합 (Oracle은 MINUS)</td></tr>
</table>`},
{num:'3',name:'트랜잭션 ACID + 회복',p:'⭐',b:`
<table class="rt"><tr><th>특성</th><th>영어</th><th>핵심</th></tr>
<tr><td><b>원자성</b></td><td>Atomicity</td><td>All or Nothing</td></tr>
<tr><td><b>일관성</b></td><td>Consistency</td><td>전후 무결성 보장</td></tr>
<tr><td><b>고립성</b></td><td>Isolation</td><td>다른 트랜잭션 끼어들기 불가</td></tr>

<tr><td><b>Undo (취소)</b></td><td>Start만 있고 Commit 없음</td><td>작업 전부 취소</td></tr>
</table>
<table class="rt" style="margin-top:8px"><tr><th>회복 기법</th><th>핵심</th></tr>
<tr><td><b>지연 갱신</b></td><td>Commit까지 DB 변경 미룸 → Redo만 사용</td></tr>
<tr><td><b>즉각 갱신</b></td><td>즉시 반영 → Redo + Undo 모두 필요</td></tr>
<tr><td><b>체크포인트</b></td><td>특정 시점 저장, 장애 시 체크포인트부터 회복</td></tr>
<tr><td><b>그림자 페이징</b></td><td>원본 복사 후 실패 시 복사본으로 대체</td></tr>
</table>

{num:'4',name:'정규화',p:'🔥',b:`

{s:'네트워크 공격',type:'fill',q:'패스워드 크래킹 중 사전에 있는 단어를 대입하는 것은 <span class="blank">( ① )</span>, 모든 문자 조합을 시도하는 것은 <span class="blank">( ② )</span>이다.',a:'① 사전 공격 (Dictionary Attack)\n② 무차별 공격 (Brute-force Attack)',d:'하이브리드 공격: 사전 공격 + 무차별 공격 결합'},

{s:'악성코드',type:'fill',q:'웜(Worm)은 숙주 없이 <span class="blank">( ① )</span>하며 네트워크로 전파, 바이러스는 <span class="blank">( ② )</span>에 기생하여 전파된다.',a:'① 자가 복제\n② 실행 파일(프로그램)',d:'트로이 목마: 정상 프로그램 위장, 자기복제 없음'},
{s:'악성코드',type:'term',q:'정상적인 프로그램으로 위장하여 사용자가 실행하면 악성 코드가 동작하며 자기 복제는 하지 않는 악성코드는?',a:'트로이 목마 (Trojan Horse)',d:'백도어, 키로거 설치에 주로 사용됨'},
// 암호 알고리즘
{s:'암호 알고리즘',type:'fill',q:'대칭키는 암호화·복호화 키가 <span class="blank">( ① )</span>, 비대칭키는 <span class="blank">( ② )</span>키와 <span class="blank">( ③ )</span>키가 따로 존재한다.',a:'① 같다 (동일)\n② 공개\n③ 개인',d:'대칭키: 빠름, 키 전달 문제 / 비대칭키: 느림, 키 전달 문제 없음'},
{s:'암호 알고리즘',type:'term',q:'KISA(한국인터넷진흥원)가 개발한 한국 최초의 블록 암호화 표준 알고리즘은?',a:'SEED',d:'한국 표준 블록 암호화 알고리즘'},
{s:'암호 알고리즘',type:'fill',q:'AES는 블록 크기 <span class="blank">( ① )</span>비트, DES는 블록 크기 <span class="blank">( ② )</span>비트이다.',a:'① 128\n② 64',d:'AES: DES의 취약점 개선, 현재 표준 / DES: IBM 개발 (구식)'},
{s:'암호 알고리즘',type:'term',q:'임의의 길이 데이터를 고정된 길이로 바꾸는 단방향 함수로, 복호화가 불가능한 암호화 방식은?',a:'해시 함수 (Hash Function)',d:'MD5·SHA-1·SHA-2가 대표적'},
{s:'암호 알고리즘',type:'fill',q:'RSA는 <span class="blank">( ① )</span> 기반, ECC는 <span class="blank">( ② )</span> 기반의 비대칭키 알고리즘이다.',a:'① 소인수분해\n② 타원곡선 이산 로그',d:'ECC는 짧은 키로 RSA와 동등한 보안 수준 제공'},
{s:'암호 알고리즘',type:'term',q:'최초의 공개키 암호 알고리즘으로 이산 로그 기반인 것은?',a:'디피-헬만 (Diffie-Hellman)',d:'비대칭키 암호의 시작 — 키 교환에 사용'},
// 접근 통제
{s:'접근 통제',type:'fill',q:'신분/식별자 기반으로 소유자가 직접 권한을 허용하는 접근 통제는 <span class="blank">( ① )</span>, 역할에 기초하여 중앙 관리자가 관리하는 것은 <span class="blank">( ② )</span>이다.',a:'① DAC (임의적 접근 통제)\n② RBAC (역할기반 접근 통제)',d:'MAC(강제적): 규칙/등급 기반, 강력한 중앙 통제'},
// 3A / 인증
{s:'인증/3A',type:'fill',q:'3A는 <span class="blank">( ① )</span>(인증), <span class="blank">( ② )</span>(권한 부여), <span class="blank">( ③ )</span>(계정 관리)이다.',a:'① Authentication\n② Authorization\n③ Accounting',d:"어쎈 인증! 어떠한 권한 부여? — Authentication은 '어쎈'으로 암기"},
{s:'인증/3A',type:'term',q:'커버로스(Kerberos)를 사용하여 한번 인증하면 여러 컴퓨터 자원에 접근할 수 있는 인증 기술은?',a:'SSO (Single Sign-On)',d:'티켓 기반, 대칭키 암호화'},
{s:'인증/3A',type:'term',q:'비밀번호를 제공하지 않고 웹사이트 접근 권한을 부여할 수 있는 인증 기술은?',a:'OAuth',d:'소셜 로그인(카카오, 구글)에서 많이 사용'},
// 클라우드/신기술
{s:'클라우드',type:'fill',q:'클라우드에서 서버·스토리지 인프라 제공은 <span class="blank">( ① )</span>, 개발 플랫폼 제공은 <span class="blank">( ② )</span>, 소프트웨어 서비스 제공은 <span class="blank">( ③ )</span>이다.',a:'① IaaS\n② PaaS\n③ SaaS',d:'Infrastructure / Platform / Software as a Service'},
{s:'소프트웨어 신기술',type:'term',q:'독립적 서비스들이 API로 통신하며 장애 격리와 DevOps를 지원하는 아키텍처는?',a:'마이크로서비스 아키텍처 (MSA)',d:'Microservice Architecture — 모놀리식의 반대'},
{s:'네트워크 신기술',type:'term',q:'IoT 표준 경량 메시징 프로토콜로 발행/구독 모델을 사용하는 것은?',a:'MQTT (Message Queuing Telemetry Transport)',d:'저전력·저대역폭 환경에 최적화'},
],
};

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let curCat='db', curMode='review';
let qList=[], qIdx=0, sc=0, sw=0, revealed=false;
let wrongList = [];
const wrongMap = {}; // cat -> array of wrong q's

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
window.onload = () => setCat('db');

function setCat(cat) {
  curCat = cat;
  const c = CATS[cat];
  document.documentElement.style.setProperty('--ac', c.color);
  document.documentElement.style.setProperty('--ac2', c.color);
  document.documentElement.style.setProperty('--ac-light', hexToLight(c.color));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.cat===cat));
  document.getElementById('hd-cat-name').textContent = c.name;
  document.getElementById('hd-badge').textContent = c.badge;
  const qc = (QZ[cat]||[]).length;
  document.getElementById('hd-stat').textContent = `문제 ${qc}개`;
  if(curMode==='review') renderReview();
  else if(curMode==='quiz') startQuiz();
  else renderWrongList();
}

function hexToLight(hex) {
  // Generate a light version of the color
  const map = {
    '#3B5BDB':'#EEF2FF','#7C3AED':'#F3EEFF','#059669':'#ECFDF5',
    '#D97706':'#FFFBEB','#DC2626':'#FFF1F1'
  };
  return map[hex] || '#EEF2FF';
}

function setMode(mode) {
  curMode = mode;
  document.querySelectorAll('.mode-tab').forEach((b,i) => b.classList.toggle('on', ['review','quiz','wronglist'][i]===mode));
  document.getElementById('view-review').classList.toggle('on', mode==='review');
  document.getElementById('view-quiz').classList.toggle('on', mode==='quiz');
  document.getElementById('view-wronglist').classList.toggle('on', mode==='wronglist');
  if(mode==='review') renderReview();
  else if(mode==='quiz') startQuiz();
  else renderWrongList();
}

// ─────────────────────────────────────────
// REVIEW
// ─────────────────────────────────────────
function renderReview() {
  const wrap = document.getElementById('view-review');
  wrap.innerHTML = (RV[curCat]||[]).map((s,i) => `
    <div class="rcard" id="rc${i}">
      <div class="rcard-hd" onclick="tog('rc${i}')">
        <div class="rcard-hd-l">
          <div class="rcard-num">${s.num}</div>
          <div class="rcard-name">${s.name}</div>
        </div>
        <span class="prob-badge">${s.p}</span>
        <span class="arr">▾</span>
      </div>
      <div class="rcard-body">${s.b}</div>
    </div>`).join('');
  tog('rc0');
}

function tog(id) {
  document.getElementById(id).classList.toggle('open');
}

// ─────────────────────────────────────────
// QUIZ
// ─────────────────────────────────────────
function startQuiz() {
  const qs = QZ[curCat] || [];
  qList = shuffle([...qs]);
  qIdx = 0; sc = 0; sw = 0; revealed = false;
  wrongList = [];
  document.getElementById('qresult').classList.remove('show');
  document.getElementById('qcard').style.display = '';
  document.getElementById('qactions').classList.remove('show');
  document.getElementById('hd-stat').textContent = `총 ${qs.length}문제`;
  if(qList.length) showQ();
}

const TYPE_LABEL = {fill:'빈칸 채우기', term:'용어 쓰기', order:'순서 나열'};
const TYPE_COLOR = {fill:'fill', term:'term', order:'order'};

function showQ() {
  if(qIdx >= qList.length) { showResult(); return; }
  const q = qList[qIdx];
  revealed = false;
  document.getElementById('q-section').textContent = q.s;
  document.getElementById('q-num').textContent = `${qIdx+1} / ${qList.length}`;
  const tb = document.getElementById('q-type-badge');
  tb.className = 'qtype-badge ' + (TYPE_COLOR[q.type]||'term');
  tb.textContent = TYPE_LABEL[q.type] || q.type;
  document.getElementById('q-txt').innerHTML = q.q.replace(/\n/g,'<br>');
  document.getElementById('q-ans').classList.remove('show');
  document.getElementById('q-ans-main').innerHTML = (q.a||'').replace(/\n/g,'<br>');
  document.getElementById('q-ans-desc').innerHTML = (q.d||'').replace(/\n/g,'<br>');
  document.getElementById('reveal-btn').style.display = '';
  document.getElementById('qactions').classList.remove('show');
  updateProg();
  // animate
  const card = document.getElementById('qcard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';
}

function reveal() {
  if(revealed) return;
  revealed = true;
  document.getElementById('q-ans').classList.add('show');
  document.getElementById('reveal-btn').style.display = 'none';
  document.getElementById('qactions').classList.add('show');
}

function mark(correct) {
  if(!correct) {
    wrongList.push(qList[qIdx]);
  }
  if(correct) sc++; else sw++;
  qIdx++;
  showQ();
}

function updateProg() {
  const total = qList.length, done = qIdx;
  document.getElementById('prog-label').textContent = `${done} / ${total}`;
  document.getElementById('pbar').style.width = (total>0 ? done/total*100 : 0) + '%';
  document.getElementById('sc-c').textContent = `✓ ${sc}`;
  document.getElementById('sc-w').textContent = `✗ ${sw}`;
}

function showResult() {
  const total = qList.length;
  const pct = Math.round(sc/total*100);
  const e = pct>=90?'🎉':pct>=70?'👍':pct>=50?'💪':'📚';
  const t = pct>=90?'완벽해요!':pct>=70?'잘했어요!':pct>=50?'절반은 맞혔어요!':'더 공부가 필요해요!';
  const sub = pct>=90?'이 파트 자신 있게 가도 됩니다!':pct>=70?'틀린 것만 복습하면 완벽!':pct>=50?'복습하고 다시 도전해 보세요.':'복습 탭으로 한 번 더 보고 오세요!';
  document.getElementById('r-emoji').textContent = e;
  document.getElementById('r-title').textContent = t;
  document.getElementById('r-sub').textContent = sub;
  document.getElementById('r-pct').textContent = pct + '%';
  document.getElementById('r-c').textContent = sc;
  document.getElementById('r-w').textContent = sw;
  document.getElementById('r-t').textContent = total;
  document.getElementById('qcard').style.display = 'none';
  document.getElementById('qactions').classList.remove('show');
  document.getElementById('qresult').classList.add('show');
  // show wrong button if needed
  const rwBtn = document.getElementById('btn-rw');
  if(wrongList.length > 0) {
    rwBtn.textContent = `❌ 틀린 문제 보기 (${wrongList.length}개)`;
    rwBtn.classList.add('show');
    // save to wrongMap
    wrongMap[curCat] = [...wrongList];
    updateWrongDot();
  } else {
    rwBtn.classList.remove('show');
  }
  updateProg();
}

function updateWrongDot() {
  const totalWrong = Object.values(wrongMap).reduce((a,v) => a+v.length, 0);
  // just update current tab dot
}

function goWrongList() {
  setMode('wronglist');
}

// ─────────────────────────────────────────
// WRONG LIST
// ─────────────────────────────────────────
function renderWrongList() {
  const wrongs = wrongMap[curCat] || [];
  document.getElementById('wl-hd').textContent = wrongs.length > 0 ? `${CATS[curCat].name} — 틀린 문제 ${wrongs.length}개` : '틀린 문제 없음';
  if(wrongs.length === 0) {
    document.getElementById('wl-body').innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--sub);font-size:14px;font-weight:700">🎉 틀린 문제가 없습니다!<br>퀴즈를 먼저 풀어보세요.</div>';
    return;
  }
  document.getElementById('wl-body').innerHTML = wrongs.map((q,i) => `
    <div class="wrong-card">
      <div class="wrong-q">${i+1}. ${q.q.replace(/<span class="blank">\( [^)]*\)<\/span>/g,'<u>( ? )</u>').replace(/<[^>]+>/g,'').replace(/\n/g,' ')}</div>
      <div class="wrong-a-label">✅ 정답</div>
      <div class="wrong-a">${(q.a||'').replace(/\n/g,'<br>')}</div>
    </div>`).join('');
}

// ─────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────
function shuffle(a) {
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
</script>
</body>
</html>
